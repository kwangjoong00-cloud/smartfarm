<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#14532d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>미니 스마트팜</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif;
    background: #f0fdf4; color: #14281d;
  }
  header {
    background: #14532d; color: #fff; padding: 14px 20px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  header h1 { margin: 0; font-size: 22px; }
  .conn { display: flex; align-items: center; gap: 10px; font-size: 15px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #9ca3af; display: inline-block; }
  .dot.ok { background: #4ade80; box-shadow: 0 0 8px #4ade80; }
  .dot.warn { background: #facc15; }
  main { padding: 16px; max-width: 1100px; margin: 0 auto; }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
  .card {
    background: #fff; border-radius: 16px; padding: 16px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08); border: 1px solid #dcfce7;
  }
  .label { font-size: 14px; color: #4b5563; }
  .value { font-size: 34px; font-weight: 700; margin-top: 4px; }
  .sub { font-size: 13px; color: #6b7280; margin-top: 4px; min-height: 1em; }
  .controls { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); margin-top: 14px; }
  .controls h2 { margin: 0 0 4px; font-size: 18px; display: flex; justify-content: space-between; align-items: center; }
  .badge { font-size: 13px; padding: 3px 10px; border-radius: 999px; background: #dcfce7; color: #166534; font-weight: 600; }
  .badge.manual { background: #fef3c7; color: #92400e; }
  .btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
  .btns.three { grid-template-columns: repeat(3, 1fr); }
  button {
    font-size: 17px; font-weight: 600; padding: 16px 6px; border-radius: 12px; border: none;
    cursor: pointer; transition: transform .05s, opacity .2s;
  }
  button:active { transform: scale(.96); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .b-green { background: #16a34a; color: #fff; }
  .b-blue  { background: #2563eb; color: #fff; }
  .b-red   { background: #dc2626; color: #fff; }
  .b-gray  { background: #e5e7eb; color: #111827; }
  .b-orange{ background: #ea580c; color: #fff; }
  #connectBtn, #usbBtn { background: #fff; color: #14532d; padding: 10px 18px; font-size: 16px; }
  .notice { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; padding: 12px 16px; border-radius: 12px; margin-bottom: 14px; display: none; }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: #111827; color: #fff; padding: 12px 20px; border-radius: 12px; font-size: 15px;
    opacity: 0; transition: opacity .3s; pointer-events: none; max-width: 90%;
  }
  .toast.show { opacity: .95; }
  details { margin-top: 14px; }
  summary { cursor: pointer; color: #4b5563; font-size: 14px; }
  #log { background: #111827; color: #a7f3d0; font: 12px/1.5 ui-monospace, monospace; padding: 10px; border-radius: 10px; height: 160px; overflow-y: auto; white-space: pre-wrap; margin-top: 8px; }
  .heater-on { color: #ea580c; }
  .rain-on { color: #2563eb; }
</style>
</head>
<body>
<header>
  <h1>🌱 미니 스마트팜</h1>
  <div class="conn">
    <span id="dot" class="dot"></span>
    <span id="connText">연결 안 됨</span>
    <button id="connectBtn">블루투스 연결</button>
    <button id="usbBtn" title="PC 크롬에서 USB 케이블로 테스트할 때">USB</button>
  </div>
</header>

<main>
  <div id="notice" class="notice"></div>

  <div class="grid">
    <div class="card"><div class="label">🌡️ 온도</div><div class="value" id="vT">--</div><div class="sub">℃</div></div>
    <div class="card"><div class="label">💧 습도</div><div class="value" id="vH">--</div><div class="sub">%</div></div>
    <div class="card"><div class="label">🌧️ 비</div><div class="value" id="vRain">--</div><div class="sub" id="vAO"></div></div>
    <div class="card"><div class="label">🪟 창문</div><div class="value" id="vWin">--</div><div class="sub" id="vWinSub"></div></div>
    <div class="card"><div class="label">🔥 히터</div><div class="value" id="vHeat">--</div><div class="sub" id="vReason"></div></div>
  </div>

  <div class="controls">
    <div class="card">
      <h2>🪟 창문 조작 <span id="wMode" class="badge">자동</span></h2>
      <div class="sub">수동으로 조작하면 1시간 뒤 자동으로 돌아가요. 비가 오면 열 수 없어요.</div>
      <div class="btns">
        <button class="b-green cmd" data-cmd="W:OPEN">⏫ 열기</button>
        <button class="b-blue cmd" data-cmd="W:CLOSE">⏬ 닫기</button>
        <button class="b-red cmd" data-cmd="W:STOP">⏹ 정지</button>
        <button class="b-gray cmd" data-cmd="W:AUTO">🔄 자동</button>
      </div>
    </div>
    <div class="card">
      <h2>🔥 히터 조작 <span id="hMode" class="badge">자동</span></h2>
      <div class="sub">30℃ 이상이면 수동이어도 꺼져요. PC의 heater_control.py가 켜져 있어야 해요.</div>
      <div class="btns three">
        <button class="b-orange cmd" data-cmd="H:ON">켜기</button>
        <button class="b-gray cmd" data-cmd="H:OFF">끄기</button>
        <button class="b-gray cmd" data-cmd="H:AUTO">🔄 자동</button>
      </div>
    </div>
  </div>

  <div class="sub" id="updated" style="margin-top:12px"></div>

  <details>
    <summary>통신 기록 보기</summary>
    <div id="log"></div>
  </details>
</main>

<div id="toast" class="toast"></div>

<script>
const SPP_UUID = "00001101-0000-1000-8000-00805f9b34fb";  // 블루투스 시리얼(SPP) 표준 UUID

// 오프라인에서도 열리도록 서비스 워커 등록 (https 주소에서만 동작)
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
let port = null, reader = null, writer = null, readDone = null;
let lastStatusAt = 0;
let pendingAck = null;   // { cmd, resolve }

const $ = id => document.getElementById(id);
const WIN_TEXT = { OPEN: "열림", CLOSED: "닫힘", OPENING: "여는 중", CLOSING: "닫는 중", UNKNOWN: "중간" };
const REASON_TEXT = {
  OK: "조건 정상", COLD: "추워서 보온 중", HUMID: "습해서 제습 중", "COLD+HUMID": "보온+제습 중",
  TOO_HOT: "과열 방지로 꺼짐", SENSOR_ERROR: "센서 오류로 꺼짐", SENSOR_RETRY: "센서 재시도 중",
  MANUAL_ON: "수동으로 켬", MANUAL_OFF: "수동으로 끔", BOOT: "시작 중"
};

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2500);
}
function log(line) {
  const el = $("log");
  el.textContent += `[${new Date().toLocaleTimeString()}] ${line}\n`;
  if (el.textContent.length > 20000) el.textContent = el.textContent.slice(-15000);
  el.scrollTop = el.scrollHeight;
}
function setConn(state, text) {
  $("dot").className = "dot " + (state || "");
  $("connText").textContent = text;
  $("connectBtn").textContent = port ? "연결 끊기" : "블루투스 연결";
  $("usbBtn").style.display = port ? "none" : "";
  document.querySelectorAll(".cmd").forEach(b => b.disabled = !port);
}

// ───── 지원 여부 확인 ─────
if (!("serial" in navigator)) {
  const n = $("notice");
  n.style.display = "block";
  n.innerHTML = "이 브라우저는 블루투스 시리얼(Web Serial)을 지원하지 않아요.<br>" +
    "안드로이드 태블릿의 <b>크롬 최신 버전</b>으로, <b>https://</b> 주소에서 열어 주세요.";
}
setConn("", "연결 안 됨");

// ───── 연결 / 해제 ─────
$("connectBtn").onclick = () => connect(false);
$("usbBtn").onclick = () => connect(true);   // PC 테스트용: USB 포트 선택

async function connect(usb) {
  if (port) { await disconnect(); return; }
  try {
    if (usb) {
      port = await navigator.serial.requestPort();
    } else {
      try {
        port = await navigator.serial.requestPort({ filters: [{ bluetoothServiceClassId: SPP_UUID }] });
      } catch (e) {
        if (e.name !== "TypeError") throw e;
        port = await navigator.serial.requestPort();   // 필터를 지원하지 않는 버전 대비
      }
    }
    setConn("warn", "연결 중...");
    await port.open({ baudRate: 9600 });
    writer = port.writable.getWriter();
    setConn("ok", "연결됨");
    toast("연결됐어요");
    log("연결됨");
    readDone = readLoop();
    sendCommand("PING");
  } catch (e) {
    port = null;
    setConn("", "연결 안 됨");
    if (e.name !== "NotFoundError") toast("연결 실패: " + e.message);   // NotFoundError = 사용자가 취소
    log("연결 실패: " + e.message);
  }
}

async function disconnect() {
  try { if (reader) await reader.cancel(); } catch (e) {}
  try { if (readDone) await readDone; } catch (e) {}   // 읽기 루프가 끝날 때까지 대기
  try { if (writer) { writer.releaseLock(); } } catch (e) {}
  try { if (port) await port.close(); } catch (e) {}
  port = reader = writer = readDone = null;
  setConn("", "연결 안 됨");
  log("연결 끊김");
}

navigator.serial?.addEventListener("disconnect", e => {
  if (port && e.target === port) { toast("블루투스 연결이 끊겼어요"); disconnect(); }
});

// ───── 수신 ─────
async function readLoop() {
  const decoder = new TextDecoder();
  let buf = "";
  try {
    reader = port.readable.getReader();
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.search(/\r?\n/)) >= 0) {
        const line = buf.slice(0, idx).trim();
        buf = buf.slice(buf[idx] === "\r" ? idx + 2 : idx + 1);
        if (line) handleLine(line);
      }
    }
  } catch (e) {
    log("수신 오류: " + e.message);
  } finally {
    try { reader.releaseLock(); } catch (e) {}
  }
}

function handleLine(line) {
  log(line);
  if (line.startsWith("STATUS ")) {
    const d = {};
    line.slice(7).split(" ").forEach(kv => { const i = kv.indexOf(":"); if (i > 0) d[kv.slice(0, i)] = kv.slice(i + 1); });
    showStatus(d);
  } else if (line.startsWith("HEATER:")) {
    const on = line === "HEATER:ON";
    $("vHeat").textContent = on ? "켜짐" : "꺼짐";
    $("vHeat").className = "value" + (on ? " heater-on" : "");
  } else if (line.startsWith("ACK:")) {
    if (pendingAck && line.slice(4) === pendingAck.cmd) pendingAck.resolve(true);
  } else if (line === "ERR:RAIN") {
    if (pendingAck) pendingAck.resolve("rain");
    toast("🌧️ 비가 와서 창문을 열 수 없어요");
  } else if (line.startsWith("EVENT:")) {
    const ev = { WINDOW_OPENED: "창문이 열렸어요", WINDOW_CLOSED: "창문이 닫혔어요", BOOT: "아두이노가 다시 시작됐어요" }[line.slice(6)];
    if (ev) toast(ev);
  }
}

function showStatus(d) {
  lastStatusAt = Date.now();
  $("vT").textContent = d.T === "ERR" ? "오류" : d.T;
  $("vH").textContent = d.H === "ERR" ? "오류" : d.H;
  const rain = d.RAIN === "1";
  $("vRain").textContent = rain ? "비 옴" : "맑음";
  $("vRain").className = "value" + (rain ? " rain-on" : "");
  $("vAO").textContent = "센서값 " + d.AO;
  $("vWin").textContent = WIN_TEXT[d.WIN] || d.WIN;
  $("vReason").textContent = REASON_TEXT[d.REASON] || d.REASON;
  setMode("wMode", d.WMODE); setMode("hMode", d.HMODE);
  $("updated").textContent = "마지막 업데이트: " + new Date().toLocaleTimeString();
}
function setMode(id, m) {
  const el = $(id), manual = m === "MANUAL";
  el.textContent = manual ? "수동" : "자동";
  el.className = "badge" + (manual ? " manual" : "");
}

// 상태가 10초 넘게 안 오면 경고
setInterval(() => {
  if (port && lastStatusAt && Date.now() - lastStatusAt > 10000) setConn("warn", "응답 없음");
  else if (port && lastStatusAt) setConn("ok", "연결됨");
}, 2000);

// ───── 송신 (응답이 없으면 최대 3번 재전송) ─────
async function sendCommand(cmd) {
  if (!writer) return;
  const enc = new TextEncoder();
  for (let i = 0; i < 3; i++) {
    const ok = await new Promise(async resolve => {
      pendingAck = { cmd, resolve };
      const timer = setTimeout(() => resolve(false), 1500);
      pendingAck.resolve = v => { clearTimeout(timer); resolve(v); };
      try { await writer.write(enc.encode(cmd + "\n")); log("> " + cmd); }
      catch (e) { clearTimeout(timer); resolve(false); }
    });
    pendingAck = null;
    if (ok) return ok;   // true 또는 "rain"
  }
  if (cmd !== "PING") toast("명령 전달 실패: " + cmd);
  return false;
}

document.querySelectorAll(".cmd").forEach(b => b.onclick = async () => {
  b.disabled = true;
  const ok = await sendCommand(b.dataset.cmd);
  b.disabled = !port;
  if (ok === true) toast({ "W:OPEN": "창문을 여는 중", "W:CLOSE": "창문을 닫는 중", "W:STOP": "창문 정지", "W:AUTO": "창문 자동 모드",
                  "H:ON": "히터 켜기", "H:OFF": "히터 끄기", "H:AUTO": "히터 자동 모드" }[b.dataset.cmd]);
});
</script>
</body>
</html>
